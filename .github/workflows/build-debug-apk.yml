name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Regenerate Gradle wrapper
        # This AI Studio-exported project didn't include the actual
        # gradlew/gradlew.bat scripts or gradle-wrapper.jar (only
        # gradle-wrapper.properties), so `./gradlew` fails with
        # "No such file or directory". setup-gradle above puts a real
        # `gradle` binary on PATH we can use to generate the missing
        # wrapper files, matching the version already pinned in
        # gradle-wrapper.properties (9.3.1, required by AGP 9.1.1).
        run: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew

      - name: Prepare debug keystore
        # app/build.gradle.kts signs the debug APK with ${rootDir}/debug.keystore
        # (storePassword/keyPassword "android", alias "androiddebugkey").
        # If the repo secret DEBUG_KEYSTORE_BASE64 exists, that SAME keystore is
        # used on every build, so a new APK installs over the old one without
        # uninstalling (no data loss). Without the secret we fall back to a
        # throwaway keystore, exactly like before.
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            echo "Using persistent debug keystore from DEBUG_KEYSTORE_BASE64"
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 secret not set; generating a throwaway keystore (each build gets a different signature)"
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Inject google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "Successfully decoded and placed app/google-services.json"
          else
            echo "GOOGLE_SERVICES_JSON secret not found or empty; skipping injection."
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rasm-debug-apk
          path: app/build/outputs/apk/debug/*.apk
